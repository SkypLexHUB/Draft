name: Unpack ZIP and Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.zip"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d unpacked_tmp
          rm -f "$ZIP_FILE"
          cp -r unpacked_tmp/. .
          rm -rf unpacked_tmp

      - name: Configure Vite base path for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          node -e '
            const fs = require("fs");
            const path = "vite.config.ts";
            if (fs.existsSync(path)) {
              let content = fs.readFileSync(path, "utf8");
              if (!content.includes("base:")) {
                content = content.replace(
                  /defineConfig\(\s*\{/,
                  "defineConfig({\n  base: \"/" + process.env.REPO_NAME + "/\","
                );
                fs.writeFileSync(path, content, "utf8");
              }
            }
          '
        env:
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Commit unpacked project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project from ZIP" || true
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: unpack-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
